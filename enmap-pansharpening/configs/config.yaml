project:
  name: enmap-pansharpening

input:
  directory: "data"
  enmap_data_root: "data/enmap/ENMAP_HSI_L2A"
  sen2_data_root: "data/sentinel2/sentinel-2-l2a"

search:
  min_overlap: 70
sentinel2_search:
  max_cloud_cover: 20
  max_time_difference_hours: 1

sentinel2_download:
  download_full_sen2_item: False

processing:
  crop_to_aoi: True

output_directory: "outputs"

housekeeping:
  cleanup_data_tmp: True
  request_delay_seconds: 2

storage:
  s3:
    enabled: false
    bucket: null
    prefix: "enmap-l2a-pansharpened-10m"

stac:
  collection_id: "enmap-l2a-pansharpened-10m"